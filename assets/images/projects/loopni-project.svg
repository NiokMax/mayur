<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="loopniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" rx="12" fill="url(#loopniBg)"/>
  
  <!-- Browser Chrome Top Bar -->
  <rect width="600" height="36" fill="#27272a"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  <rect x="80" y="8" width="220" height="20" rx="4" fill="#3f3f46"/>
  <text x="92" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a1a1aa">https://loopni.shop</text>
  
  <!-- Website Mockup Body -->
  <g transform="translate(60, 90)">
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2">LOOPNI</text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#a1a1aa" letter-spacing="0.5">CLOTHING &amp; ACCESSORIES BRAND</text>
    
    <line x1="0" y1="95" x2="120" y2="95" stroke="#3b82f6" stroke-width="3"/>
    
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#71717a">Official brand website designed and built by Mayur Bikash Gogoi.</text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#71717a">E-commerce storefront &amp; brand identity in development.</text>
    
    <!-- Badges -->
    <rect x="0" y="180" width="105" height="28" rx="6" fill="#27272a"/>
    <text x="12" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">E-Commerce</text>
    
    <rect x="115" y="180" width="130" height="28" rx="6" fill="#27272a"/>
    <text x="127" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">Web Development</text>

    <rect x="255" y="180" width="145" height="28" rx="6" fill="#1e3a8a"/>
    <text x="267" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Brand in Development</text>
