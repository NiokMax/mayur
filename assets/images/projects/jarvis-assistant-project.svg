<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="jarvisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="380" rx="12" fill="url(#jarvisBg)"/>
  
  <!-- Conceptual Arc Wave Visual -->
  <circle cx="480" cy="190" r="120" fill="url(#arcGlow)"/>
  <circle cx="480" cy="190" r="80" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="480" cy="190" r="50" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="480" cy="190" r="16" fill="#38bdf8" opacity="0.9"/>
  
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#0369a1"/>
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" letter-spacing="1">IN DEVELOPMENT</text>
    
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">Personal AI Assistant</text>
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">Inspired by JARVIS from Iron Man</text>
    
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Voice-controlled intelligent assistant exploration for natural interaction,</text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">multilingual command handling, and local desktop automation.</text>

    <!-- Tech tags -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="75" height="26" rx="4" fill="#1e293b"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Python</text>
      
      <rect x="85" y="0" width="80" height="26" rx="4" fill="#1e293b"/>
      <text x="96" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">NLP / AI</text>
      
      <rect x="175" y="0" width="125" height="26" rx="4" fill="#1e293b"/>
      <text x="187" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Voice Interaction</text>
    </g>
  </g>
</svg>
