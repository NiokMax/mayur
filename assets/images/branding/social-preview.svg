<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Border / Grid -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Monogram Brand Badge -->
  <g transform="translate(100, 110)">
    <rect width="90" height="90" rx="18" fill="#2563eb"/>
    <text x="45" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MBG</text>
  </g>

  <!-- Name and Tagline -->
  <g transform="translate(100, 260)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Mayur Bikash Gogoi</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#60a5fa">Full-Stack Developer • Freelancer • Founder of Loopni</text>
    
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8">Computer Science &amp; Engineering Student at Nalbari Polytechnic, Assam</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8">Copywriting • AI Prompt Engineering • Social Media Management • Community Design</text>
  </g>

  <!-- Domain Badge -->
  <g transform="translate(100, 480)">
    <rect width="260" height="50" rx="25" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="130" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">https://mayurbg.in</text>
  </g>
</svg>
