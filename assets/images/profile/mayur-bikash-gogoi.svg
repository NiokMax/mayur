<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="480" rx="20" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.3"/>
  </pattern>
  <rect width="400" height="480" fill="url(#dotGrid)"/>

  <!-- Centered Avatar Silhouette / Monogram Frame -->
  <g transform="translate(140, 120)">
    <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#subtleShadow)"/>
    <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="1.5">MBG</text>
  </g>

  <!-- Camera / Upload icon hint -->
  <g transform="translate(180, 260)" opacity="0.6">
    <path d="M4 7h4l2-3h10l2 3h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="13" r="4" fill="none" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Mayur Bikash Gogoi</text>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Full-Stack Developer • Assam, India</text>
  
  <rect x="50" y="375" width="300" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Profile Photo Placeholder (Replace with your JPG/PNG)</text>
</svg>
